name: okay
description: Messages that express simple acknowledgment, agreement, or affirmation.
priority: 7

keyword_rules:
  - name: okay_keywords_and_phrases
    description: Matches common expressions
    match_mode: exact
    keywords:
    - k
    - kk
    - ok
    - okay
    - okie
    - okk
    - okayy
    - okayyy
    - okey
    - okiedokie
    - okie dokie
    - o k
    - ok ok
    - ok cool
    - okay will do
    - roger
    - roger that
    - rgr
    - copy
    - gotcha
    - got it
    - got u
    - gotit
    - received
    - noted
    - acknowledged
    - understood
    - bet
    - word
    - facts
    - all good
    - looks good
    - sounds good
    - fair enough
    - works for me
    - that works
    - fair
    - i will
    - will do
    - im okay
    - i know
    - ik
    - maybe
    - i guess

  - name: kw_yes_variants
    description: Affirmative yes words and common spellings/abbreviations.
    match_mode: exact
    keywords:
    - 'yes'
    - yees
    - yep
    - yup
    - yeah
    - yea
    - ya
    - ye
    - affirmative
    - absolutely
    - definitely
    - certainly
    - of course
    - indeed
    - ofc
    - obv
    - obviously
    - duh
    - uh huh
    - mhm
    - yessir
    - sure
    - for sure
    - hell yeah

  - name: kw_positive_reactions
    description: Standalone positive reaction words
    match_mode: exact
    keywords:
    - great
    - awesome
    - cool
    - nice
    - amazing
    - fantastic
    - wonderful
    - perfect
    - excellent
    - good
    - fabulous
    - lovely
    - splendid
    - superb
    - terrific
    - very good
    - dope
    - lit
    - fire
    - love you
    - love ya
    - love it
    - yay

regex_rules:
  - name: short_acknowledgment
    description: Short acknowledgment messages with optional mild filler
    match_mode: include
    pattern: '^\s*(?:ok(?:ay)?|o\s+k|k+|cool|great|awesome|nice|fine|yes|ye+s|yeah|yep|yup)\s*$'

  - name: repeated_acknowledgment
    description: Repeated acknowledgment forms like ok ok or okay okay
    match_mode: include
    pattern: '^\s*(?:ok(?:ay)?|o\s+k|k+)(?:\s+(?:ok(?:ay)?|o\s+k|k+))+\s*$'

  - name: acknowledgment_with_modifier
    description: Acknowledgment with small conversational modifiers
    match_mode: include
    pattern: '^\s*(?:ok(?:ay)?|o\s+k|yeah|yep|yup)\s+(?:sounds\s+good|that\s+s\s+fine|thats\s+fine|all\s+good|cool|will\s+do)\s*$'

  - name: sounds_good_variants
    description: Variations of sounds good
    match_mode: include
    pattern: '^\s*(?:that\s+)?sounds\s+(?:good|great|fine)\s*$'

  - name: fair_acknowledgment
    description: Short acknowledgment phrases like fair, thats fair, or ok fair
    match_mode: include
    pattern: '^\s*(?:(?:ok(?:ay)?\s+|o\s+k\s+|yeah\s+|yep\s+|yup\s+)*)?(?:that\s+s\s+fair|thats\s+fair|fair)\s*$'

  - name: i_am_okay_response
    description: Responses indicating the user is okay
    match_mode: include
    pattern: '^\s*(?:(?:yeah|yea|yep|yup|no)\s+)?(?:i\s+(?:am|m)|im)?\s*(?:ok(?:ay)?|fine|good)\s*(?:thanks)?\s*$'

  - name: love_variants
    description: Variations of love you, love it, etc.
    match_mode: include
    pattern: '^\W*(?:\b(?:i\s+)?love\s+(?:you|u|ya|it)(?:\s+too)?\b)\W*$'

  - name: its_im_okay
    description: Variations of its okay, im ok, etc.
    match_mode: include
    pattern: '^\s*(?:(?:it\s+s|its|it|i\s+m|im)\s+)?(?:ok(?:ay)?|good|fine|great)\s*$'

  - name: will_do_affirmation
    description: Will do responses optionally prefixed by okay
    match_mode: include
    pattern: '^\s*(?:(?:ok(?:ay)?|o\s+k)\s+)?will\s+do\s*$'

  - name: ok_plus_positive_reaction
    description: Acknowledgment followed by a positive reaction such as ok cool
    match_mode: include
    pattern: '^\s*(?:ok(?:ay)?|o\s+k)\s+(?:cool|great|awesome|nice|good|fine)\s*$'

  - name: okay_sent_from_vehicle
    description: Short acknowledgment followed by a car-system "sent from my <vehicle>" signature (e.g. "yes sent from my frontier")
    match_mode: include
    pattern: '^\s*(?:yes|yeah|yea|yep|yup|ok|okay|k|sure|alright|sounds\s+good|got\s+it)\s+sent\s+from\s+(?:my\s+)?[a-z0-9 ]{1,25}\s*$'

  - name: ack_commitment_regex
    description: Short commitments or deferential acknowledgments (e.g. "ok i will", "will try", "please do", "yes sir")
    match_mode: include
    pattern: '^\s*(?:(?:ok(?:ay)?|sure|yes|yeah)\s+)?(?:i\s+(?:will|ll)(?:\s+(?:try|do\s+that|do\s+it|try\s+that))?|will\s+(?:try|do)|sure\s+will|please\s+do|(?:yes\s+)?(?:sir|ma\s+am))\s*$'

  - name: positive_mood_regex
    description: Short positive mood replies (e.g. "not bad", "doing well", "so far so good")
    match_mode: include
    pattern: '^\s*(?:not\s+bad|pretty\s+good|(?:(?:i\s+(?:m|am)|im)\s+)?doing\s+(?:very\s+|really\s+)?(?:good|well|great|alright|ok|okay)|all\s+is\s+(?:good|well)|so\s+far\s+so\s+good|positive|outstanding|(?:very\s+|a\s+)?good\s+mood|great\s+mood)\s*$'

  - name: light_reaction_regex
    description: Bare light reactions (e.g. "lol", "haha", "wow", "amen")
    match_mode: include
    pattern: '^\s*(?:lol|lmao|rofl|haha+|ha(?:\s+ha)+|hehe+|wow|amen(?:\s+amen)?)\s*$'
