name: giftcard
description: Users inquiring about gift cards or gift codes incentives
priority: 8

keyword_rules:
  - name: giftcard_exact
    description: Standalone gift card or code messages
    match_mode: token
    keywords:
      - gift card
      - giftcard
      - gift code
      - amazon gift card
      - amazon code

regex_rules:
  - name: amazon_card_basic
    description: Amazon card mentions (including implicit gift cards)
    match_mode: include
    pattern: '\b(?:amazon\s+(?:gift\s*)?(?:card|code)s?|gift\s*(?:card|code)s?)\b'
