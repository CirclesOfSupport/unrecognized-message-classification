name: thanks
description: Messages that express gratitude, appreciation, or thanks.
priority: 4

keyword_rules:
  - name: thanks_keywords_and_phrases
    description: Matches common expressions of gratitude and appreciation
    match_mode: exact
    keywords:
      - appreciate it
      - i appreciate it
      - ok thanks
      - okay thanks
      - thank u
      - thank you
      - thank you very much
      - thanks
      - thanks so much
      - thanks very much
      - thanx
      - thnks
      - thx
      - thnx
      - ty
      - tysm
      - cool thanks
      - got it thank you
      - got it thank u

regex_rules:
  - name: standalone_thanks
    description: Short standalone thanks messages with optional mild modifiers
    match_mode: include
    pattern: '^\s*(?:ok(?:ay)?\s*(?:,|\.)?\s*|well\s+)?(?:th(?:a*n+k+s*|x+|ks+)|t+h+a*n+k+y+|t+y+|thank\s*(?:you|u)(?:\s+very)?(?:\s+much)?|th(?:a*n+k+)?\s*(?:you|u)|thanks?\s+so\s+much|thanks?\s+very\s+much|thanx|tks|thnks|tysm)(?:\s*(?:!+|\.+))?(?:\s*[^A-Za-z0-9]+)?\s*$'

  - name: appreciation_phrases
    description: Direct appreciation statements
    match_mode: include
    pattern: '^\s*(?:i\s+)?(?:really\s+)?appreciate\s+(?:it|that|this|your\s+help)\s*(?:!+|\.+)?\s*$'

  - name: much_appreciated
    description: Much appreciated variants
    match_mode: include
    pattern: '^\s*(?:very\s+|so\s+)?much\s+appreciated\s*(?:!+|\.+)?\s*$'

  - name: no_thanks
    description: Exclude refusals such as no thanks or no thank you
    match_mode: exclude
    pattern: '\b(?:no|nah|nope)\s+(?:thanks|thank\s+you|thank\s+u|thx|thnx|ty)\b'

  - name: thanks_anyway_rejection
    description: Exclude likely dismissive or refusal-adjacent thanks anyway phrases
    match_mode: exclude
    pattern: '\b(?:thanks\s+anyway|thank\s+you\s+anyway|thx\s+anyway)\b'

  - name: sarcastic_or_rejection_thanks
    description: Exclude likely rejection forms like thanks but no thanks
    match_mode: exclude
    pattern: '\b(?:thanks|thank\s+you|thank\s+u|thx|thnx)\b.*\bbut\s+no\s+thanks\b'

  - name: thanks_whitelisted_tail
    description: Thanks with an optional leading filler word and an optional closed-list ending (e.g. "yes thanks", "thanks for checking in")
    match_mode: include
    pattern: '^\s*(?:(?:ok|okay|yes|yeah|yea|yep|great|sure|alright|well|oh)\s+)?(?:thank\s+you|thanks|thank\s+u|thx|ty)(?:\s+(?:so\s+very\s+much|very\s+much|so\s+much|a\s+lot|much|again|bot|earlybot|sir|mam|ma\s+am|you|you\s+too|and\s+you\s+too|you\s+also|you\s+as\s+well))?(?:\s+for\s+(?:checking(?:\s+in)?(?:\s+on\s+me)?|asking|caring|reaching\s+out|that|this|(?:the|your)\s+(?:info|information|reminder|advice|support|help|link|message|text|resources|update|follow\s+up|concern|time)))?\s*$'

  - name: got_it_thanks
    description: Acknowledgment plus thanks in either order (e.g. "got it thanks", "will do thanks", "thank you i will")
    match_mode: include
    pattern: '^\s*(?:(?:ok|okay|oh\s+ok|cool|got\s+it|gotcha|will\s+do|i\s+will|i\s+ll|i\s+know|sounds\s+good|sure\s+will|sure|yup|alright|good|great|awesome)\s+(?:and\s+)?(?:thank\s+you|thanks|thank\s+u|thx|ty)|(?:thank\s+you|thanks|thank\s+u|thx|ty)\s+(?:i\s+will|i\s+ll|will\s+do|i\s+appreciate\s+(?:it|that)|i\s+know|good))\s*$'

  - name: thanks_wellbeing_reply
    description: Short wellbeing reply followed by thanks (e.g. "i m good thank you", "doing well thanks")
    match_mode: include
    pattern: '^\s*(?:i\s+m|i\s+am|im|we\s+re|we\s+are|doing|all\s+is|it\s+s)\s+(?:very\s+|really\s+|pretty\s+)?(?:good|well|great|ok|okay|alright|fine)\s+(?:thank\s+you|thanks|thank\s+u|thx)\s*$'
